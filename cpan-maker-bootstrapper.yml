---
commands:
  add-plugin:               CPAN::Maker::Bootstrapper::Role::AddPlugin
  create-build-config:      CPAN::Maker::Bootstrapper::Role::CreateBuildConfig
  create-config:            CPAN::Maker::Bootstrapper::Role::CreateConfig
  create-deps:              CPAN::Maker::Bootstrapper::Role::CreateDeps
  create-darkpan-requires:  CPAN::Maker::Bootstrapper::Role::DarkPANRequires
  critique:                 CPAN::Maker::Bootstrapper::Role::Critic
  default:                  cmd_install
  extra-files:              CPAN::Maker::Bootstrapper::Role::ExtraFiles
  filter:                   CPAN::Maker::Bootstrapper::Role::Filter 
  install:                  CPAN::Maker::Bootstrapper::Role::Installer
  import:                   CPAN::Maker::Bootstrapper::Role::Importer
  import-scaffold:          CPAN::Maker::Bootstrapper::Role::ScaffoldImporter
  perlcritic:               CPAN::Maker::Bootstrapper::Role::PerlCritic
  perltidy:                 CPAN::Maker::Bootstrapper::Role::PerlTidy
  provides:                 CPAN::Maker::Bootstrapper::Role::Provides
  reconcile-deps:           CPAN::Maker::Bootstrapper::Role::ReconcileDeps
  show-defaults:            CPAN::Maker::Bootstrapper::Role::ShowDefaults
  uninstall:                CPAN::Maker::Bootstrapper::Role::Uninstall
  version:                  CPAN::Maker::Bootstrapper::Role::Version
roles:
  deps-filter:              CPAN::Maker::Bootstrapper::Role::DepsFilter
  dist-file:                CPAN::Maker::Bootstrapper::Role::DistFile
  resolve-vars:             CPAN::Maker::Bootstrapper::Role::ResolveVars
  update-available:         CPAN::Maker::Bootstrapper::Role::UpdateAvailable
options:
- auto-annotate|A
- annotate|a=s@
- color!
- comment|co=s
- context|C=s@
- debug|d
- dry-run|D
- exclude=s@
- file-list|L=s
- filter=s
- finalize-annotations|F
- history!
- max-diff-files=i
- path-only
- project-tarball
- prompt|p=s
- prompt-profile|P=s@
- help|h
- basedir|b=s
- config|c=s
- email|e=s
- force|f!
- github-user|g=s
- installdir|i=s
- import|I=s@
- module|m=s
- resources|r=s
- strict!
- stub|s=s
- username|u=s
- vars-file=s
- severity=i
- theme=s
- profile=s
abbreviations: 1
alias:
  options:
    dryrun: dry-run
extra_options:
  - dist_dir
  - import_file_listing
  - help_sections
  - reader
default_options:
  color: 1
  strict: 1
  help_sections:
      - SYNOPSIS
      - COMMANDS
      - OPTIONS
